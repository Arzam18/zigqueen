name: Zigqueen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show build.zig.zon
        run: |
          if [ -f build.zig.zon ]; then
            echo "----- build.zig.zon -----"
            cat build.zig.zon
            echo "--------------------------"
          else
            echo "No build.zig.zon found"
          fi

      - name: Install Zig (latest stable)
        run: |
          ZIG_JSON=$(curl -sL https://ziglang.org/download/index.json)
          ZIG_URL=$(echo "$ZIG_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          keys = [k for k in data.keys() if k != 'master']
          keys.sort(key=lambda v: [int(x) for x in v.split('.')])
          latest_stable = keys[-1] if keys else None
          version = latest_stable or 'master'
          print(data[version]['x86_64-linux']['tarball'])
          ")
          echo "Downloading Zig from: $ZIG_URL"
          wget -q "$ZIG_URL" -O zig.tar.xz
          mkdir zig-toolchain
          tar -xf zig.tar.xz -C zig-toolchain --strip-components=1
          echo "$PWD/zig-toolchain" >> $GITHUB_PATH

      - name: Show Zig version
        run: |
          zig version

      - name: Patch build.zig for compatibility
        run: |
          sed -i '/exe\.want_lto = true;/d' build.zig
          sed -i '/if (target\.result\.os\.tag == \.linux) exe\.link_emit_relocs = true;/d' build.zig

      - name: Build for Android ARM64
        run: |
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast

      - name: List build output
        run: |
          find zig-out -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zigqueen-android-arm64
          path: zig-out/bin/*

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Zigqueen Build ${{ github.run_number }}
          prerelease: true
          files: zig-out/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
